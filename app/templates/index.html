<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Control de Acceso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="nombre_usuario" placeholder="Usuario" required><br>
            <input type="password" id="contraseña" placeholder="Contraseña" required><br>
            <button type="submit">Ingresar</button>
        </form>
        <div id="error-message" class="error"></div>
    </div>

    <script>
        // Capturar el formulario de login
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault(); // Evitar el comportamiento por defecto del formulario

            const nombreUsuario = document.getElementById('nombre_usuario').value;
            const contrasena = document.getElementById('contraseña').value;

            // Limpiar cualquier mensaje de error previo
            errorMessage.textContent = '';

            try {
                const response = await fetch('http://localhost:5000/login', {  // Ajusta esta URL a la URL de tu servidor
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nombre_usuario: nombreUsuario,
                        contraseña: contrasena
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Login exitoso! Token: ' + data.access_token);
                    // Aquí puedes almacenar el token y redirigir al usuario a otra página
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
            } catch (error) {
                errorMessage.textContent = error.message;
            }
        });
    </script>

</body>
</html>
